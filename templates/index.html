<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Survival — Fresh Build</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='game.css') }}">
</head>
<body>
  <div id="error-banner" style="display:none; background:red; color:white; padding:10px; text-align:center; font-family:monospace;"></div>

  <div class="game-shell">
    <header class="top-bar">
      <h1>RETRO<span>SURVIVE</span></h1>
      <div class="stats">
        <span>POS: <strong id="ui-pos">0, 0</strong></span>
        <span>HP: <strong id="ui-hp">3</strong></span>
      </div>
    </header>

    <div class="viewport">
      <canvas id="screen" width="960" height="540"></canvas>

      <div id="shop-panel" class="shop-panel hidden">
        <button id="shop-close" class="shop-close" aria-label="Close shop">×</button>
        <h2>Little Hub Shop</h2>
        <p class="shop-currency">Cycles: <strong id="shop-cycles">0</strong></p>
        <button id="buy-heal">Full heal · 5 cycles</button>
        <button id="buy-health">+1 max health · 10 cycles</button>
        <p id="shop-status" aria-live="polite">Welcome, explorer!</p>
      </div>
      
      <div id="start-screen" class="screen-overlay">
        <h2>READY TO DEPLOY?</h2>
        <p>Explore the procedural grid. Return to (0,0) for the Hub.</p>
        <button id="launch-btn">ENTER SIMULATION</button>
      </div>
    </div>
  </div>

  <script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
